app = "9mmreloaders"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  REQUIRE_BUSINESS = "0"
  DB_PATH = "./data/catalog.db"
  DB_READONLY = "1"
  TRUST_PROXY = "1"
  ROBOTS_MODE = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "data"
  destination = "/app/data"
