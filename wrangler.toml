# Cloudflare Workers with Containers + Static Assets fallback
# Deploy with: npx wrangler deploy
# - Without Docker: deploys static dist/ to Workers (functional)
# - With Docker: also builds container for dynamic Express backend
#
# For Cloudflare Pages (static export):
# - Build command: npm run build
# - Output directory: dist
# - Deploy command: empty

name = "9mmreloaders"
main = "src/worker-container.js"
compatibility_date = "2024-09-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Static assets - makes Workers URL functional even without container
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# binding = "ASSETS" is automatic in new wrangler, but we can name it
binding = "ASSETS"

# Container that runs the Express app - new syntax (wrangler >=4.131)
[[containers]]
class_name = "Backend"
image = "./Dockerfile"
max_instances = 1

# Durable Object binding for container
[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

# Migration for Durable Object - required for container
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

[vars]
NODE_ENV = "production"
REQUIRE_BUSINESS = "0"
PORT = "8080"
DB_PATH = "./data/catalog.db"
DB_READONLY = "1"
TRUST_PROXY = "1"
ROBOTS_MODE = "auto"
