# Cloudflare Workers with Containers - runs Express backend (better-sqlite3) on Cloudflare
# Deploy with: npx wrangler deploy
# Requires: Cloudflare account with Workers Containers enabled (beta)
#
# For Cloudflare Pages (static export):
# - Build command: npm run build
# - Output directory: dist
# - Do NOT set deploy command to wrangler deploy in Pages dashboard
# Pages will deploy dist/ as static files, no wrangler needed
#
# For Workers Containers:
# - This wrangler.toml is used
# - Run: npx wrangler deploy (needs Docker for image build, or --containers-rollout=none)

name = "9mmreloaders"
main = "src/worker-container.js"
compatibility_date = "2024-09-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Container that runs the Express app - new syntax (wrangler >=4.131)
[[containers]]
class_name = "Backend"
image = "./Dockerfile"
max_instances = 1

# Durable Object binding for container
[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

# Migration for Durable Object - required for container
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

[vars]
NODE_ENV = "production"
REQUIRE_BUSINESS = "0"
PORT = "8080"
DB_PATH = "./data/catalog.db"
DB_READONLY = "1"
TRUST_PROXY = "1"
ROBOTS_MODE = "auto"
