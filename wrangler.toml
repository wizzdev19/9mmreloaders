# Cloudflare Workers with Container - runs Express backend (better-sqlite3) on Cloudflare
# Deploy: npx wrangler deploy
# Requires: Cloudflare account with Workers Containers enabled (beta)
# Also valid for Pages (pages_build_output_dir) so Pages build doesn't warn

pages_build_output_dir = "dist"

name = "9mmreloaders"
main = "src/worker-container.js"
compatibility_date = "2024-09-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Container that runs the Express app - new syntax
[[containers]]
class_name = "Backend"
image = "./Dockerfile"
max_instances = 1

# Durable Object binding for container
[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

# Migration for Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

[vars]
NODE_ENV = "production"
REQUIRE_BUSINESS = "0"
PORT = "8080"
DB_PATH = "./data/catalog.db"
DB_READONLY = "1"
TRUST_PROXY = "1"
ROBOTS_MODE = "auto"
