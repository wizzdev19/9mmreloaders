# Cloudflare Workers with Container - runs Express backend (better-sqlite3) on Cloudflare
# This solves Pages limitations: cart POST, images, sessions all work
# Deploy: npx wrangler deploy
# Requires: Cloudflare account with Workers Containers enabled (beta)
# Also valid for Pages (pages_build_output_dir) so Pages build doesn't warn

pages_build_output_dir = "dist"

name = "9mmreloaders"
main = "src/worker-container.js"
compatibility_date = "2024-09-12"
compatibility_flags = ["nodejs_compat"]

# Container that runs the Express app
[[containers]]
name = "BACKEND"
image = "./Dockerfile"
# Port the container listens on (Express listens on 8080)
port = 8080
# Keep at least 1 instance warm
instances = 1

[vars]
NODE_ENV = "production"
REQUIRE_BUSINESS = "0"
PORT = "8080"
DB_PATH = "./data/catalog.db"
DB_READONLY = "1"
TRUST_PROXY = "1"
ROBOTS_MODE = "auto"

# Optional: D1 for submissions if you want to persist beyond container disk
# [[d1_databases]]
# binding = "SUBMISSIONS_DB"
# database_name = "9mmreloaders-submissions"
# database_id = "replace-with-id"

# R2 for product images (optional, if you want to serve from R2 instead of container)
# [[r2_buckets]]
# binding = "PRODUCT_IMAGES"
# bucket_name = "9mmreloaders-images"
