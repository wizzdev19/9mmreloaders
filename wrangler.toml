# Cloudflare Workers with Container - runs Express backend (better-sqlite3) on Cloudflare
# Deploy: npx wrangler deploy
# Requires: Cloudflare account with Workers Containers enabled (beta)

pages_build_output_dir = "dist"

name = "9mmreloaders"
main = "src/worker-container.js"
compatibility_date = "2024-09-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[containers]]
name = "BACKEND"
image = "./Dockerfile"
port = 8080
instances = 1

[vars]
NODE_ENV = "production"
REQUIRE_BUSINESS = "0"
PORT = "8080"
DB_PATH = "./data/catalog.db"
DB_READONLY = "1"
TRUST_PROXY = "1"
ROBOTS_MODE = "auto"
